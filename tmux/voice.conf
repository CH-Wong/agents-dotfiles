# Local voice dictation for Claude Code prompts (whisper.cpp-based).
# Requires ~/agents-dotfiles/voice/setup-whisper.sh to have been run once.

set -g status-left "#(~/bin/tmux-voice-status.sh '#{client_width}' '[#{session_name}] ')"
set -g status-left-length 250
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %H:%M %d-%b-%y"
set -g status-interval 5

# prefix + v: toggle local voice dictation (start/stop+transcribe+inject).
# Runs fully detached -- never suspends or replaces the pane's own screen.
bind-key v run-shell -b "~/bin/voice-toggle.sh"
