# Copy-mode always pipes the selection through clip.exe (WSL interop to
# the real Windows executable) instead of relying on tmux's OSC 52
# `set-clipboard external` escape-code round trip through the terminal
# emulator. OSC 52 support/behavior varies by terminal and was landing
# copies only in tmux's own buffer, not the real Windows clipboard.
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
bind-key -T copy-mode M-w send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
bind-key -T copy-mode C-w send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
